<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujan Jewellers - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #eef2f5; text-align: center; }
        .box { background: #fff; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, button { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .delete-btn { background-color: #dc3545; width: auto; padding: 5px 10px; margin-left: 10px; }
        .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 5px 0; }
    </style>
</head>
<body>

    <!-- ১. পাসওয়ার্ড দিয়ে প্রবেশ করার সেকশন -->
    <div id="loginSection" class="box">
        <h2>অ্যাডমিন লগইন</h2>
        <input type="password" id="passInput" placeholder="পাসওয়ার্ড লিখুন">
        <button onclick="login()">প্রবেশ করুন</button>
        <p id="errorMsg" style="color:red;"></p>
    </div>

    <!-- ২. পণ্য যোগ ও কাস্টমাইজ করার ড্যাশবোর্ড -->
    <div id="adminDashboard" class="box hidden">
        <h2>পণ্য ও দাম যোগ করুন</h2>
        <input type="text" id="pName" placeholder="পণ্যের নাম (যেমন: স্বর্ণের চেইন)">
        <input type="number" id="pPrice" placeholder="দাম (টাকায়)">
        <button onclick="addProduct()">পণ্য যোগ করুন</button>

        <h3>বর্তমান পণ্যের তালিকা</h3>
        <div id="adminProductList"></div>
        <br>
        <button onclick="logout()" style="background-color:#6c757d;">লগআউট</button>
    </div>

    <script>
        // তোমার গোপন পাসওয়ার্ড (প্রয়োজন অনুযায়ী পরিবর্তন করে নিও)
        const ADMIN_PASSWORD = "1234"; 

        function login() {
            const pass = document.getElementById('passInput').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                renderAdminProducts();
            } else {
                document.getElementById('errorMsg').innerText = "ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।";
            }
        }

        function logout() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('passInput').value = '';
        }

        function addProduct() {
            const name = document.getElementById('pName').value.trim();
            const price = document.getElementById('pPrice').value.trim();

            if (!name || !price) {
                alert("পণ্যের নাম ও দাম দুটোই লিখুন!");
                return;
            }

            let products = JSON.parse(localStorage.getItem('sujan_products')) || [];
            products.push({ name, price });
            localStorage.setItem('sujan_products', JSON.stringify(products));

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            renderAdminProducts();
            alert("পণ্য সফলভাবে যোগ করা হয়েছে!");
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem('sujan_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('sujan_products', JSON.stringify(products));
            renderAdminProducts();
        }

        function renderAdminProducts() {
            const list = document.getElementById('adminProductList');
            let products = JSON.parse(localStorage.getItem('sujan_products')) || [];
            list.innerHTML = '';

            products.forEach((prod, index) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <span><strong>${prod.name}</strong> - ৳${prod.price}</span>
                    <button class="delete-btn" onclick="deleteProduct(${index})">মুছে ফেলুন</button>
                `;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
