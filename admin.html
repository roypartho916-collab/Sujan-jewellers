<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujan Jewellers - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #fff; max-width: 400px; width: 90%; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .delete-btn { background-color: #dc3545; width: auto; padding: 6px 12px; font-size: 13px; margin: 0; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>

<div class="box">
    <!-- লগইন ফর্ম -->
    <div id="loginForm">
        <h2>অ্যাডমিন লগইন</h2>
        <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন">
        <button onclick="login()">প্রবেশ করুন</button>
    </div>

    <!-- অ্যাডমিন ড্যাশবোর্ড -->
    <div id="adminContent" class="hidden">
        <h2>পণ্য ও ওজন যোগ করুন</h2>
        <input type="text" id="pName" placeholder="পণ্যের নাম (যেমন: ঝুমকো)">
        <input type="text" id="pWeight" placeholder="ওজন (যেমন: ১ ভরি ২ আনা / ১০ গ্রাম)">
        <button onclick="addProduct()">পণ্য যোগ করুন</button>

        <h3>বর্তমান পণ্যের তালিকা</h3>
        <div id="adminProductList"></div>
        <br>
        <button onclick="logout()" style="background-color: #6c757d;">লগআউট</button>
    </div>
</div>

<script>
    function login() {
        const pass = document.getElementById('password').value;
        if(pass === "1234") {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            loadAdminProducts();
        } else {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function addProduct() {
        const name = document.getElementById('pName').value.trim();
        const weight = document.getElementById('pWeight').value.trim();

        if(!name) { alert("পণ্যের নাম লিখুন"); return; }

        const products = JSON.parse(localStorage.getItem('sujan_products')) || [];
        products.push({ id: Date.now(), name, weight: weight || 'যোগাযোগ করুন' });
        localStorage.setItem('sujan_products', JSON.stringify(products));

        document.getElementById('pName').value = '';
        document.getElementById('pWeight').value = '';
        loadAdminProducts();
        alert("পণ্য যোগ করা হয়েছে!");
    }

    function deleteProduct(id) {
        let products = JSON.parse(localStorage.getItem('sujan_products')) || [];
        products = products.filter(p => p.id !== id);
        localStorage.setItem('sujan_products', JSON.stringify(products));
        loadAdminProducts();
    }

    function loadAdminProducts() {
        const list = document.getElementById('adminProductList');
        const products = JSON.parse(localStorage.getItem('sujan_products')) || [];
        list.innerHTML = '';
        products.forEach(p => {
            list.innerHTML += `
                <div class="item">
                    <div>
                        <strong>${p.name}</strong><br>
                        <small style="color: #555;">ওজন: ${p.weight}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">মুছুন</button>
                </div>
            `;
        });
    }

    function logout() {
        location.reload();
    }
</script>

</body>
</html>
